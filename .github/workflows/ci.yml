name: CI

permissions: {}

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FOUNDRY_PROFILE: ci

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # action v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Build
        run: just build

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # action v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Lint
        run: just lint

  slither:
    name: Slither
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # action v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # action v8.2.0
      - name: Install Slither
        run: uv sync --project dev --locked
      - name: Slither
        run: just slither

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORK_RPC_URL: ${{ secrets.FORK_RPC_URL }}
      FOUNDRY_PROFILE: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # action v7.0.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Test
        run: forge test -vvv --show-progress --gas-snapshot-check true
      - name: Coverage
        run: just coverage-check
